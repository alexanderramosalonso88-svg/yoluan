<html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto | Farmacia Doc.Yoluan</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
    color:black;
}

/* ENCABEZADO */

header{
    width:100%;
    background:white;
    padding:35px 60px;
    border-bottom:1px solid #dcdcdc;
}

header h1{
    font-size:38px;
    margin-bottom:10px;
}

header p{
    font-size:11px;
    color:#555;
    line-height:1.7;
}

/* CONTENEDOR */

.contenedor{
    width:100%;
    display:flex;
    gap:25px;
    padding:45px 60px;
    flex-wrap:wrap;
}

/* CAJAS */

.caja{
    flex:1;
    min-width:320px;
    background:white;
    border:1px solid #dcdcdc;
    padding:30px;
}

/* TITULOS */

.caja h2{
    font-size:22px;
    margin-bottom:20px;
}

/* TEXTO */

.caja p{
    font-size:11px;
    line-height:1.8;
    margin-bottom:12px;
    color:black;
}

/* FORMULARIO */

input,
textarea{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:1px solid #d0d0d0;
    background:#fafafa;
    font-size:11px;
    outline:none;
}

/* BOTON */

button{
    width:100%;
    padding:14px;
    background:black;
    color:white;
    border:none;
    font-size:11px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#333;
}

/* FINAL */

.final{
    width:100%;
    background:white;
    border-top:1px solid #dcdcdc;
    text-align:center;
    padding:22px;
    font-size:12px;
    font-weight:bold;
}

/* RESPONSIVE */

@media(max-width:768px){

header,
.contenedor{
    padding:25px;
}

}

</style>
</head>

<body>

<!-- ENCABEZADO -->

<header>

<h1>Farmacia Doc.Yoluan</h1>

<p>
Página privada de contacto y consultas personalizadas.
</p>

</header>

<!-- CONTENIDO -->

<div class="contenedor">

<!-- CONTACTO -->

<div class="caja">

<h2>Contacto</h2>

<p><strong>Nombre:</strong> Yoluan</p>

<p><strong>Teléfono:</strong> 3313555167</p>

<p><strong>Correo:</strong> alexanderramosalonso88@gmail.com</p>

<p>
Atención profesional y servicio personalizado para cada cliente.
</p>

</div>

<!-- FORMULARIO -->

<div class="caja">

<h2>Solicitar Consulta</h2>

<form action="mailto:alexanderramosalonso88@gmail.com" method="POST" enctype="text/plain">

<input type="text" name="nombre" placeholder="Nombre del cliente" required>

<input type="text" name="apellido" placeholder="Apellido del cliente" required>

<input type="number" name="edad" placeholder="Edad del cliente" required>

<input type="tel" name="telefono" placeholder="Número telefónico" required>

<textarea name="consulta" rows="5" placeholder="Escriba su consulta"></textarea>

<button type="submit">
ENVIAR CONSULTA
</button>

</form>

</div>

</div>

<!-- FINAL -->

<div class="final">

Para servirle a DIOS y a usted

</div>

</body>
</html>
